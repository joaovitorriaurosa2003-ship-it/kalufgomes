<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E1F06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auditoria Balcão">
<title>Auditoria Balcão · Pão Delícia</title>
<meta name="description" content="App de auditoria diária do balcão da Pão Delícia: checklist por etapas, histórico e indicadores de conformidade.">
<link rel="manifest" href="auditoria-pd/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="auditoria-pd/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="auditoria-pd/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="auditoria-pd/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="auditoria-pd/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Firebase (compat SDK, sem bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --brown:#5C2E08; --brown-2:#7A4419; --brown-3:#3E1F06; --brown-4:#26130A;
  --gold:#C49A6C; --gold-soft:#E9D7BE; --gold-2:#DDB88C;
  --cream:#FBF6EE; --paper:#FFFFFF; --paper-2:#FBF6EE; --line:#E7DCC9;
  --ink:#2B1B0E; --ink-soft:#7A6A56; --ink-faint:#A6937A;
  --ok:#2E7D32; --ok-bg:#E5F3E6; --ok-line:#BFE1C2;
  --warn:#B4740E; --warn-bg:#FBF0DC; --warn-line:#F0D9A6;
  --crit:#B23A2E; --crit-bg:#FBE6E2; --crit-line:#F2C4BB;
  --shadow-sm: 0 2px 10px -4px rgba(60,32,8,.18);
  --shadow: 0 12px 30px -12px rgba(60,32,8,.28);
  --shadow-lg: 0 22px 46px -18px rgba(60,32,8,.4);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#1B0F07; --paper:#271609; --paper-2:#20120A; --line:#432A14;
    --ink:#F3E7D6; --ink-soft:#C7AF92; --ink-faint:#8E7A62;
    --gold-soft:#4A3418;
    --ok-bg:#152C1D; --ok-line:#1F4A2A; --warn-bg:#33260C; --warn-line:#4C3A12; --crit-bg:#34160F; --crit-line:#4E2018;
    --shadow-sm: 0 2px 10px -4px rgba(0,0,0,.5);
    --shadow: 0 12px 30px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 22px 46px -18px rgba(0,0,0,.7);
  }
  :root:not([data-theme="light"]) .kpi-card .kpi-value:not(.ok):not(.crit),
  :root:not([data-theme="light"]) .nav-btn.active,
  :root:not([data-theme="light"]) .btn-ghost,
  :root:not([data-theme="light"]) .turno-toggle button.active,
  :root:not([data-theme="light"]) .cat-check-row .go{color:var(--gold-2)}
  :root:not([data-theme="light"]) .login-card .brand-mark img{filter:brightness(0) invert(.9) sepia(.35)}
  :root:not([data-theme="light"]) .btn:not(.btn-ghost):not(.btn-gold){background:var(--brown-2)}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; letter-spacing:.2px; margin:0}
.num{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:inherit; -webkit-appearance:none; appearance:none}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}
::selection{background:var(--gold-soft)}

/* ---------- layout shell ---------- */
.app-root{max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; background:var(--cream); box-shadow:0 0 60px rgba(0,0,0,.08)}

/* ---------- login ---------- */
.login-view{
  min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:28px 20px calc(28px + var(--safe-b));
  background:
    radial-gradient(560px 360px at 15% -10%, rgba(196,154,108,.35), transparent 60%),
    radial-gradient(480px 320px at 110% 10%, rgba(122,68,25,.4), transparent 60%),
    linear-gradient(160deg,var(--brown-3),var(--brown) 60%,var(--brown-2));
  position:relative; overflow:hidden;
}
.login-view::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:18px 18px; opacity:.5; pointer-events:none;
}
.login-card{
  position:relative; background:var(--paper); border-radius:var(--r-xl); padding:36px 28px 28px;
  width:100%; max-width:380px; box-shadow:var(--shadow-lg); text-align:center;
  animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn{from{opacity:0; transform:translateY(18px) scale(.98)} to{opacity:1; transform:none}}
.login-card .brand-mark{height:64px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px}
.login-card .brand-mark img{height:100%; width:auto; max-width:100%; object-fit:contain}
.login-card h2{font-size:21px; margin-bottom:4px}
.login-card p.sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px}
.field{margin-bottom:14px; text-align:left}
.field label{display:block; font-size:11.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px}
.field input{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; font-size:15px;
  background:var(--paper-2); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 4px rgba(196,154,108,.22)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:14px; padding:14px 18px; font-weight:800; font-size:14.5px; cursor:pointer;
  background:var(--brown); color:#fff; transition:transform .12s ease, box-shadow .15s ease, opacity .15s ease;
  box-shadow:0 10px 22px -10px rgba(92,46,8,.6);
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6; cursor:default; transform:none}
.btn-block{width:100%}
.btn-ghost{background:transparent; color:var(--brown); box-shadow:none; border:1.5px solid var(--line)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:var(--brown-3); box-shadow:0 10px 22px -10px rgba(196,154,108,.7)}
.login-error{color:var(--crit); font-size:12.5px; font-weight:700; margin-top:12px; min-height:16px}
.kg-credit{margin-top:24px; padding-top:18px; border-top:1px solid var(--line)}
.kg-credit img{width:auto; max-width:110px; height:auto; border-radius:8px; box-shadow:0 4px 14px -6px rgba(0,0,0,.35); display:block; margin:0 auto}
.kg-credit .kg-label{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-faint); font-weight:800; margin-bottom:8px}

/* ---------- app shell ---------- */
.appbar{
  position:sticky; top:0; z-index:30; padding:calc(14px + var(--safe-t)) 18px 14px;
  background:linear-gradient(160deg,var(--brown-3),var(--brown));
  color:#F3E7D6; display:flex; align-items:center; gap:12px;
  box-shadow:0 8px 24px -14px rgba(0,0,0,.45);
}
.appbar .logo-mark{height:30px; flex:none; display:flex; align-items:center}
.appbar .logo-mark img{height:100%; width:auto; object-fit:contain; filter:brightness(0) invert(1); opacity:.95}
.appbar .titles{flex:1; min-width:0}
.appbar .titles .t1{font-family:'Fraunces',serif; font-size:16.5px; line-height:1.2}
.appbar .titles .t2{font-size:11.5px; color:#D8C3A5; opacity:.9}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:none; background:rgba(255,255,255,.12);
  color:#F3E7D6; display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .15s ease, transform .12s ease;
}
.icon-btn:active{transform:scale(.92); background:rgba(255,255,255,.22)}
.icon-btn svg{width:18px; height:18px}

main.view{padding:18px 16px calc(96px + var(--safe-b)); min-height:60vh}
.view-fade{animation:viewFade .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewFade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; z-index:40;
  background:var(--paper); border-top:1px solid var(--line);
  padding:8px 10px calc(10px + var(--safe-b));
  box-shadow:0 -8px 24px -18px rgba(0,0,0,.35);
}
.bottom-nav-inner{display:flex; position:relative}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px;
  background:none; border:none; color:var(--ink-faint); cursor:pointer; border-radius:14px;
  font-size:10.5px; font-weight:800; letter-spacing:.2px; transition:color .18s ease, transform .12s ease;
}
.nav-btn svg{width:22px; height:22px; transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.nav-btn.active{color:var(--brown)}
.nav-btn.active svg{transform:translateY(-2px) scale(1.08)}
.nav-btn:active{transform:scale(.94)}

/* ---------- cards / commons ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-sm)}
.card + .card{margin-top:14px}
.section-title{font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); margin:22px 2px 10px}
.section-title:first-child{margin-top:0}
.hello{margin-bottom:4px}
.hello .h1{font-size:22px}
.hello .sub{color:var(--ink-soft); font-size:13.5px; margin-top:2px; text-transform:capitalize}

.today-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.today-card{
  border-radius:var(--r-lg); padding:16px; position:relative; overflow:hidden; cursor:pointer;
  border:1.5px solid var(--line); background:var(--paper); transition:transform .15s ease, box-shadow .15s ease;
}
.today-card:active{transform:scale(.97)}
.today-card .turno-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); display:flex; align-items:center; gap:6px}
.today-card .turno-label svg{width:14px; height:14px}
.today-card .turno-status{margin-top:10px; font-family:'Fraunces',serif; font-size:19px}
.today-card .turno-pct{font-size:12px; color:var(--ink-soft); margin-top:2px}
.today-card.done{border-color:var(--ok-line); background:var(--ok-bg)}
.today-card.done .turno-status{color:var(--ok)}
.today-card.pending{border-style:dashed}
.today-card.pending .turno-status{color:var(--ink-faint)}
.today-card .go-arrow{position:absolute; right:14px; bottom:14px; opacity:.5}
.today-card .go-arrow svg{width:16px; height:16px}

.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.kpi-card{border-radius:var(--r-lg); padding:16px; background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow-sm)}
.kpi-card .kpi-label{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px}
.kpi-card .kpi-value{font-family:'Fraunces',serif; font-size:26px; margin-top:6px; color:var(--brown)}
.kpi-card .kpi-value.ok{color:var(--ok)}
.kpi-card .kpi-value.crit{color:var(--crit)}
.kpi-card .kpi-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px}

.chart-card{padding-bottom:8px}
.chart-wrap{position:relative; height:170px; margin-top:6px}

.rank-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-row .rank-idx{width:22px; height:22px; border-radius:50%; background:var(--gold-soft); color:var(--brown-3); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
.rank-row .rank-name{flex:1; min-width:0; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rank-row .rank-meta{font-size:11.5px; color:var(--ink-soft)}
.rank-row .rank-val{font-weight:800; font-size:13.5px}

.empty-state{text-align:center; padding:34px 12px; color:var(--ink-soft)}
.empty-state svg{width:44px; height:44px; margin-bottom:10px; opacity:.5}
.empty-state .t{font-weight:800; color:var(--ink); font-size:14.5px; margin-bottom:4px}
.empty-state .s{font-size:12.5px}

/* ---------- wizard (nova auditoria) ---------- */
.wizard-head{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.wizard-progress{flex:1; height:7px; border-radius:99px; background:var(--line); overflow:hidden}
.wizard-progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--brown)); border-radius:99px; transition:width .35s cubic-bezier(.3,.8,.3,1)}
.wizard-step-label{font-size:11.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap}
.wizard-title{font-size:19px; margin-bottom:2px}
.wizard-sub{font-size:13px; color:var(--ink-soft); margin-bottom:18px}
.wizard-content{min-height:38vh}

.setup-grid{display:grid; gap:14px}
.obs-card textarea{margin-top:8px}
.foto-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.foto-th{position:relative; width:72px; height:72px}
.foto-th img{width:100%; height:100%; object-fit:cover; border-radius:12px; border:1px solid var(--line); cursor:pointer}
.foto-del{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:none; background:var(--crit); color:#fff; font-size:15px; line-height:1; cursor:pointer}
.foto-add{width:72px; height:72px; border-radius:12px; border:1.5px dashed var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; font-weight:800; color:var(--ink-soft); cursor:pointer}
.foto-add svg{width:20px; height:20px}
.detail-obs{margin-top:8px; padding:10px 12px; background:var(--paper-2); border-radius:12px; font-size:13px; color:var(--ink-soft); white-space:pre-wrap}
.detail-time{margin-bottom:14px; font-size:13px; font-weight:700; color:var(--ink-soft)}
.hub-list{display:grid; gap:12px}
.hub-card{display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:16px; transition:transform .15s ease, box-shadow .15s ease}
.hub-card:active{transform:scale(.98)}
.hub-ico{flex:none; width:48px; height:48px; border-radius:14px; background:var(--gold-soft); color:var(--brown-3); display:flex; align-items:center; justify-content:center}
.hub-ico svg{width:24px; height:24px}
.hub-body{flex:1; min-width:0}
.hub-name{font-family:'Fraunces',serif; font-size:18px}
.hub-desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px}
.hub-meta{font-size:11.5px; color:var(--ink-faint); margin-top:6px}
.hub-badge{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:99px}
.hub-badge svg{width:13px; height:13px}
.hub-badge.done{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-line)}
.hub-badge.pending{background:var(--paper-2); color:var(--ink-soft); border:1px dashed var(--line)}
.hub-go{flex:none; opacity:.5}
.hub-go svg{width:18px; height:18px}
.hub-chip{display:inline-flex; align-items:center; gap:8px; background:var(--gold-soft); color:var(--brown-3); border-radius:14px; padding:10px 14px; font-size:14px}
.hub-chip svg{width:18px; height:18px}
.turno-toggle{display:flex; gap:8px; background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:5px}
.turno-toggle button{
  flex:1; border:none; background:none; padding:11px 8px; border-radius:10px; font-weight:800; font-size:13.5px;
  color:var(--ink-soft); cursor:pointer; transition:background .18s ease, color .18s ease, box-shadow .18s ease;
}
.turno-toggle button.active{background:var(--paper); color:var(--brown); box-shadow:var(--shadow-sm)}

.item-card{border:1px solid var(--line); border-radius:var(--r-md); padding:14px 14px 12px; margin-bottom:12px; background:var(--paper); transition:border-color .2s ease}
.item-card.answered{border-color:var(--gold)}
.item-card .item-label{font-size:14.5px; font-weight:700; line-height:1.35; margin-bottom:10px}
.item-card .item-crit{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; color:var(--crit); text-transform:uppercase; letter-spacing:.3px; margin-bottom:8px}
.item-card .item-crit svg{width:11px; height:11px}
.pill-row{display:flex; flex-wrap:wrap; gap:8px}
.pill{
  border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink); border-radius:99px; padding:9px 14px;
  font-size:13px; font-weight:700; cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.pill:active{transform:scale(.95)}
.pill.sel-ok{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok)}
.pill.sel-warn{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn)}
.pill.sel-crit{background:var(--crit-bg); border-color:var(--crit-line); color:var(--crit)}
.item-card textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px;
  background:var(--paper-2); color:var(--ink); resize:vertical; min-height:64px;
}
.item-card textarea:focus{outline:none; border-color:var(--gold)}
.cat-progress{font-size:12px; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:8px}
.cat-progress .bar{flex:1; height:5px; background:var(--line); border-radius:99px; overflow:hidden}
.cat-progress .bar i{display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .25s ease}

.review-gauge{display:flex; align-items:center; gap:16px; margin-bottom:6px}
.gauge-ring{position:relative; width:84px; height:84px; flex:none}
.gauge-ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.gauge-ring .gauge-val{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:17px; font-weight:700}
.review-status-label{font-weight:800; font-size:15px}
.review-status-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px}
.cat-check-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.cat-check-row:last-child{border-bottom:none}
.cat-check-row svg{width:16px; height:16px; flex:none}
.cat-check-row.ok{color:var(--ink)}
.cat-check-row.pending{color:var(--ink-faint)}
.cat-check-row .go{margin-left:auto; font-size:11.5px; font-weight:800; color:var(--brown); cursor:pointer}

.wizard-nav{display:flex; gap:10px; margin-top:20px}
.wizard-nav .btn{flex:1}

/* ---------- histórico ---------- */
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); border-radius:99px;
  padding:8px 13px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:all .15s ease;
  display:flex; align-items:center; gap:5px;
}
.chip.active{background:var(--brown); border-color:var(--brown); color:#fff}
.chip select{background:transparent; border:none; color:inherit; font-weight:700; font-size:12.5px}
.chip select:focus{outline:none}

.hist-card{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--paper); margin-bottom:10px; cursor:pointer; transition:transform .12s ease, box-shadow .15s ease;
}
.hist-card:active{transform:scale(.98)}
.hist-card .hc-date{flex:none; width:46px; text-align:center}
.hist-card .hc-date .d{font-family:'Fraunces',serif; font-size:18px; line-height:1}

.sheet-backdrop{

.sheet-backdrop.open{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:520px; z-index:61;

function categoriasComItens(itens){ return CATEGORIAS.filter(c => itens.some(i=>i.cat===c)); }

function calcConformidade(itens, respostas){
  let pontos=0, total=0, criticosNao=0, faltando=[];
  itens.forEach(it=>{
    if(it.tipo==="texto") return;
    const r = respostas[it.id];
    if(r===undefined || r===null || r===""){ faltando.push(it.label); return; }
    total++;
    if(CONFORMES.has(r)) pontos+=1;
    else if(PARCIAIS.has(r)) pontos+=0.5;
    if(it.crit && !CONFORMES.has(r)) criticosNao++;
  });
  const pct = total ? Math.round((pontos/total)*1000)/10 : 0;
  return {pct, criticosNao, faltando};
}
function statusFromPct(pct){
  if(pct>=90) return {cls:"ok",label:"Conforme"};
  if(pct>=70) return {cls:"warn",label:"Atenção"};
  return {cls:"crit",label:"Crítico"};
}
function faltamObrigatorios(itens, respostas){
  const faltando=[];
  itens.forEach(it=>{
    const r = respostas[it.id];
    if(r===undefined || r===null || String(r).trim()==="") faltando.push(it.label);
  });
  return faltando;
}

function todayISO(){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDataLonga(iso){
  try{
    const [y,m,d]=iso.split("-").map(Number);
    return new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  }catch(e){ return iso; }
}
function fmtDataCurta(iso){
  try{
    const [y,m,d]=iso.split("-").map(Number);
    const dt=new Date(y,m-1,d);
    return {d:String(d).padStart(2,"0"), m:dt.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")};
  }catch(e){ return {d:"--",m:"--"}; }
}
function fmtDataBR(iso){
  if(!iso || typeof iso!=="string" || iso.split("-").length!==3) return esc(iso||"-");
  const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`;
}

function fmtHora(iso){
  if(!iso) return "";
  const d=new Date(iso);
  return isNaN(d)? "" : d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function duracaoMin(a,b){
  const x=new Date(a), y=new Date(b);
  if(isNaN(x)||isNaN(y)) return null;
  return Math.max(0, Math.round((y-x)/60000));
}
function comprimirFoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const max=900, k=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",0.6));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("imagem inválida")); };
    img.src=url;
  });
}
function abrirFoto(src){
  const o=document.createElement("div");
  o.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px";
  const im=document.createElement("img");
  im.src=src; im.style.cssText="max-width:100%;max-height:100%;border-radius:12px";
  o.appendChild(im); o.addEventListener("click",()=>o.remove());
  document.body.appendChild(o);
}

let toastTimer=null;
function toast(msg, type){
  const el=document.getElementById("toast");
  el.className = "toast show " + (type||"ok");
  el.innerHTML = (type==="err"? icon("alert") : icon("checkCircle")) + `<span>${msg}</span>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.classList.remove("show"); }, 2600);
}
function confirmDialog(title, msg, okLabel){
  return new Promise(resolve=>{
    const bd=document.getElementById("confirm-backdrop");
    bd.innerHTML = `
      <div class="confirm-box">
        <h3>${title}</h3>
        <p>${msg}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" id="cf-cancel">Cancelar</button>
          <button class="btn" style="background:var(--crit)" id="cf-ok">${okLabel||"Confirmar"}</button>
        </div>
      </div>`;
    bd.classList.add("open");
    const close=(v)=>{ bd.classList.remove("open"); setTimeout(()=>bd.innerHTML="",200); resolve(v); };
    bd.querySelector("#cf-cancel").onclick=()=>close(false);
    bd.querySelector("#cf-ok").onclick=()=>close(true);
    bd.onclick=(ev)=>{ if(ev.target===bd) close(false); };
  });
}

function subscribeAuditorias(){

  unsubAuditorias = db.collection("auditorias").onSnapshot(snap=>{
    STATE.auditorias = snap.docs.map(d=>({id:d.id, ...d.data()}));

async function salvarAuditoriaFirestore(registro){
  const docId = `${registro.data}_${registro.turno}`;
  await db.collection("auditorias").doc(docId).set({
    horaInicio: registro.horaInicio || null,
    horaFim: registro.horaFim || null,
    obsEtapas: registro.obsEtapas || {},
    fotos: registro.fotos || [],
    data: registro.data,
    turno: registro.turno,
    responsavel: registro.responsavel,
    respostas: registro.respostas,
    pct: registro.pct,
    criticosNao: registro.criticosNao,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
  });
}

function auditoriaDoTurnoHoje(turno){

}
function animateCount(el, to, decimals){
  const from=0, dur=650, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const eased=1-Math.pow(1-p,3);
    const val=from+(to-from)*eased;
    el.textContent = decimals? val.toFixed(decimals) : Math.round(val);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- WIZARD: NOVA AUDITORIA ---------- */
function wizardSteps(){
  const itens = itensDoTurno(STATE.wizard.turno);
  const cats = categoriasComItens(itens);
  return [{type:"setup"}, ...cats.map(c=>({type:"cat", cat:c})), {type:"review"}];
}

function renderHub(el){
  destroyCharts();
  const cards = CHECKLIST_DEFS.map(d=>{
    const itens = d.id==="Manhã"? ITENS_MANHA : ITENS_TARDE;
    const cats = categoriasComItens(itens).length;
    const au = auditoriaDoTurnoHoje(d.id);
    let status;
    if(au){
      const st=statusFromPct(au.pct);
      status = `<span class="hub-badge done">${icon("checkCircle")} Hoje: ${Number(au.pct)||0}% · ${st.label}</span>`;
    } else {
      status = `<span class="hub-badge pending">Pendente hoje</span>`;
    }
    return `<button type="button" class="hub-card" data-check="${d.id}">
      <div class="hub-ico">${icon(d.icone)}</div>
      <div class="hub-body">
        <div class="hub-name">${d.nome}</div>
        <div class="hub-desc">${d.desc}</div>
        <div class="hub-meta num">${itens.length} itens · ${cats} etapas</div>
        ${status}
      </div>
      <div class="hub-go">${icon("chevronRight")}</div>
    </button>`;
  }).join("");
  el.innerHTML = `
    <h2 class="wizard-title">Checklists de auditoria</h2>
    <p class="wizard-sub">Escolha qual checklist você vai aplicar agora.</p>
    <div class="hub-list">${cards}</div>`;
  el.querySelectorAll(".hub-card").forEach(c=>{
    c.addEventListener("click", ()=>{
      const id=c.dataset.check;
      const au=auditoriaDoTurnoHoje(id);
      if(au){
        confirmDialog("Já existe auditoria de hoje", `${defChecklist(id).nome} já foi registrada hoje. Deseja abrir o resultado?`, "Abrir resultado")
          .then(ok=>{ if(ok) abrirDetalhe(au); });
        return;
      }
      STATE.wizard = novoWizard(id);
      renderView();
    });
  });
}

function renderWizard(el){
  if(!STATE.wizard){ renderHub(el); return; }
  const w = STATE.wizard;
  const steps = wizardSteps();
  if(w.step >= steps.length) w.step = steps.length-1;
  const step = steps[w.step];
  const pct = steps.length>1 ? (w.step/(steps.length-1))*100 : 0;

  let stepLabel = `${w.step+1} / ${steps.length}`;
  let body = "";

  if(step.type==="setup"){
    body = renderStepSetup();
  } else if(step.type==="cat"){
    body = renderStepCategoria(step.cat);
  } else if(step.type==="review"){
    body = renderStepRevisao();
  }

  el.innerHTML = `
    <div class="wizard-head">
      <button class="icon-btn" id="wz-close" style="background:var(--gold-soft); color:var(--brown-3)">${icon("x")}</button>
      <div class="wizard-progress"><div class="wizard-progress-fill" style="width:${pct}%"></div></div>
      <div class="wizard-step-label num">${stepLabel}</div>
    </div>
    <div class="wizard-content view-fade">${body}</div>
  `;

  document.getElementById("wz-close").addEventListener("click", async ()=>{
    const temDados = Object.keys(w.respostas).length>0;
    if(temDados){
      const ok = await confirmDialog("Sair do checklist?", "As respostas já preenchidas serão descartadas.", "Descartar");
      if(!ok) return;
    }
    STATE.wizard=null; renderBottomNav(); renderView();
  });
  bindStepEvents(step);
}

function renderStepCategoria(cat){
  const w=STATE.wizard;
  const itens = itensDoTurno(w.turno).filter(i=>i.cat===cat);
  const respondidos = itens.filter(i=> w.respostas[i.id]!==undefined && String(w.respostas[i.id]).trim()!=="").length;
  const catIco = CAT_ICON[cat] || "circle";

  const itemsHtml = itens.map(it=>{
    const val = w.respostas[it.id];
    const answered = val!==undefined && String(val).trim()!=="";
    if(it.tipo==="texto"){
      return `
      <div class="item-card ${answered?'answered':''}">
        <div class="item-label">${it.label}</div>
        <textarea data-id="${it.id}" placeholder="Escreva aqui...">${esc(val)}</textarea>
      </div>`;
    }
    const pills = it.opts.map(o=>{
      let cls="pill";
      if(val===o){
        cls += CONFORMES.has(o) ? " sel-ok" : PARCIAIS.has(o) ? " sel-warn" : " sel-crit";
      }
      return `<button type="button" class="${cls}" data-id="${it.id}" data-val="${o}">${o}</button>`;
    }).join("");
    return `
    <div class="item-card ${answered?'answered':''}">
      ${it.crit? `<div class="item-crit">${icon('alert')} Item crítico</div>` : ""}
      <div class="item-label">${it.label}</div>
      <div class="pill-row">${pills}</div>
    </div>`;
  }).join("");

  return `
    <h2 class="wizard-title">${cat}</h2>
    <div class="cat-progress">
      <span>${icon(catIco)}</span>
      <div class="bar"><i style="width:${itens.length? (respondidos/itens.length*100):0}%"></i></div>
      <span class="num">${respondidos}/${itens.length}</span>
    </div>
    ${itemsHtml}
    <div class="item-card obs-card">
      <div class="item-label">Observações desta etapa <span style="font-weight:600; color:var(--ink-faint)">(opcional)</span></div>
      <textarea data-obs="${cat}" placeholder="Anote o que chamou atenção...">${esc((w.obs||{})[cat])}</textarea>
      <div class="foto-row">
        ${(w.fotos||[]).map((f,i)=> f.cat===cat? `<div class="foto-th"><img src="${f.src}" data-foto="${i}" alt="Foto"><button type="button" class="foto-del" data-del="${i}" aria-label="Remover foto">&times;</button></div>` : "").join("")}
        <label class="foto-add">${icon('plus')}<span>Foto</span><input type="file" accept="image/*" id="wz-foto" hidden></label>
      </div>
    </div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="wz-back">${icon('chevronLeft')} Voltar</button>
      <button class="btn" id="wz-next">Próximo ${icon('chevronRight')}</button>
    </div>
  `;
}

function renderStepRevisao(){
  const w=STATE.wizard;
  const itens=itensDoTurno(w.turno);
  const cats=categoriasComItens(itens);
  const {pct, criticosNao} = calcConformidade(itens, w.respostas);
  const faltando = faltamObrigatorios(itens, w.respostas);
  const st = statusFromPct(pct);
  const circ = 2*Math.PI*36;
  const dash = circ - (pct/100)*circ;
  const color = st.cls==="ok"? "var(--ok)" : st.cls==="warn"? "var(--warn)" : "var(--crit)";

  const rows = cats.map(cat=>{
    const catItens = itens.filter(i=>i.cat===cat);
    const catFalt = catItens.filter(i=>{ const v=w.respostas[i.id]; return v===undefined || String(v).trim()===""; });
    const ok = catFalt.length===0;
    return `<div class="cat-check-row ${ok?'ok':'pending'}">
      ${ok? icon('checkCircle') : icon('circle')}
      <span>${cat}</span>
      <span class="go" data-cat="${cat}">${ok? 'revisar' : `${catFalt.length} pendente${catFalt.length>1?'s':''}`}</span>
    </div>`;
  }).join("");

  return `
    <h2 class="wizard-title">Revisão final</h2>
    <p class="wizard-sub">Confira o resultado antes de salvar.</p>
    <div class="card">
      <div class="review-gauge">
        <div class="gauge-ring">
          <svg viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="7"/>
            <circle cx="42" cy="42" r="36" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${dash}"/>
          </svg>
          <div class="gauge-val num">${pct}%</div>
        </div>
        <div>
          <div class="review-status-label" style="color:${color}">${st.label}</div>
          <div class="review-status-sub">${criticosNao} ${criticosNao===1?'item crítico reprovado':'itens críticos reprovados'}</div>
          <div class="review-status-sub num">${w.turno} · ${fmtDataBR(w.data)}</div>
        </div>
      </div>
    </div>
    <div class="section-title">Checklist por categoria</div>
    <div class="card">${rows}</div>
    ${faltando.length? `
    <div class="card" style="border-color:var(--crit-line); background:var(--crit-bg)">
      <div style="font-weight:800; color:var(--crit); font-size:13px; margin-bottom:6px">${icon('alert')} Faltam ${faltando.length} resposta${faltando.length>1?'s':''}</div>
      <div style="font-size:12.5px; color:var(--ink-soft)">Volte nas categorias marcadas acima para concluir antes de salvar.</div>
    </div>` : ""}
    ${STATE.auditorias.some(a=>a.id===`${w.data}_${w.turno}`)? `
    <div class="warn-note">${icon('alert')}<span>Já existe uma auditoria de ${w.turno} em ${fmtDataBR(w.data)}. Ao salvar, ela será substituída por esta.</span></div>` : ""}
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="wz-back">${icon('chevronLeft')} Voltar</button>
      <button class="btn btn-gold" id="wz-save" ${faltando.length?'disabled':''}>${icon('check')} Salvar auditoria</button>
    </div>
  `;
}

function goStep(n){
  STATE.wizard.step=n;
  renderWizard(document.getElementById("view"));
  window.scrollTo({top:0, behavior:"smooth"});
}

function bindStepEvents(step){
  const w=STATE.wizard;
  const steps=wizardSteps();

  if(step.type==="setup"){
    document.getElementById("wz-data").addEventListener("change", e=> w.data=e.target.value);
    document.getElementById("wz-resp").addEventListener("input", e=> w.responsavel=e.target.value);
    document.getElementById("wz-next").addEventListener("click", ()=>{
      if(!w.data){
        toast("Informe a data da auditoria.", "err");
        return;
      }
      if(!w.responsavel || !w.responsavel.trim()){
        toast("Informe o nome de quem está auditando.", "err");
        document.getElementById("wz-resp").focus();
        return;
      }
      goStep(w.step+1);
    });
  }

  if(step.type==="cat"){
    const refreshCatProgress=()=>{
      const itens=itensDoTurno(w.turno).filter(i=>i.cat===step.cat);
      const n=itens.filter(i=>{ const v=w.respostas[i.id]; return v!==undefined && String(v).trim()!==""; }).length;
      const bar=document.querySelector(".cat-progress .bar i");
      const lbl=document.querySelector(".cat-progress .num");
      if(bar) bar.style.width=(itens.length? n/itens.length*100 : 0)+"%";
      if(lbl) lbl.textContent=`${n}/${itens.length}`;
    };
    document.querySelectorAll(".pill[data-id]").forEach(p=>{
      p.addEventListener("click", ()=>{
        const val=p.dataset.val;
        w.respostas[p.dataset.id]=val;
        const card=p.closest(".item-card");
        card.querySelectorAll(".pill").forEach(x=>x.classList.remove("sel-ok","sel-warn","sel-crit"));
        p.classList.add(CONFORMES.has(val)?"sel-ok":PARCIAIS.has(val)?"sel-warn":"sel-crit");
        card.classList.add("answered");
        refreshCatProgress();
      });
    });
    document.querySelectorAll("textarea[data-id]").forEach(ta=>{
      ta.addEventListener("input", ()=>{
        w.respostas[ta.dataset.id]=ta.value;
        ta.closest(".item-card").classList.toggle("answered", ta.value.trim()!=="");
        refreshCatProgress();
      });
    });
    document.querySelector("textarea[data-obs]").addEventListener("input", e=>{ (w.obs=w.obs||{})[step.cat]=e.target.value; });
    const rerender=()=>{ const y=window.scrollY; renderWizard(document.getElementById("view")); window.scrollTo(0,y); };
    document.querySelectorAll("img[data-foto]").forEach(im=> im.addEventListener("click", ()=> abrirFoto(im.src)));
    document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", ()=>{ w.fotos.splice(Number(b.dataset.del),1); rerender(); }));
    document.getElementById("wz-foto").addEventListener("change", async e=>{
      const f=e.target.files[0]; if(!f) return;
      if(w.fotos.length>=MAX_FOTOS){ toast(`Limite de ${MAX_FOTOS} fotos por auditoria.`, "err"); return; }
      try{
        const src=await comprimirFoto(f);
        const total=w.fotos.reduce((n,x)=>n+x.src.length,0)+src.length;
        if(total>MAX_FOTOS_CHARS){ toast("Fotos demais para esta auditoria. Remova alguma.", "err"); return; }
        w.fotos.push({cat:step.cat, src}); rerender();
      }catch(err){ toast("Não foi possível usar essa foto.", "err"); }
    });
    document.getElementById("wz-back").addEventListener("click", ()=> goStep(w.step-1));
    document.getElementById("wz-next").addEventListener("click", ()=> goStep(w.step+1));
  }

  if(step.type==="review"){
    document.getElementById("wz-back").addEventListener("click", ()=> goStep(w.step-1));
    document.querySelectorAll(".go[data-cat]").forEach(g=>{
      g.addEventListener("click", ()=>{
        const idx = steps.findIndex(s=>s.type==="cat" && s.cat===g.dataset.cat);
        if(idx>=0) goStep(idx);
      });
    });
    const saveBtn=document.getElementById("wz-save");
    if(saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        saveBtn.disabled=true; saveBtn.textContent="Salvando...";
        try{
          const itens=itensDoTurno(w.turno);
          const {pct, criticosNao} = calcConformidade(itens, w.respostas);
          const respostasFinal = {...w.respostas, __resp: w.responsavel.trim()};
          await salvarAuditoriaFirestore({
            data:w.data, turno:w.turno, responsavel:w.responsavel.trim(),
            respostas:respostasFinal, pct, criticosNao,
            horaInicio:w.horaInicio, horaFim:new Date().toISOString(),
            obsEtapas:Object.fromEntries(Object.entries(w.obs||{}).filter(([,v])=>String(v).trim())),
            fotos:w.fotos||[],
          });
          mostrarSucesso(pct);
        }catch(err){
          console.error(err);
          toast("Erro ao salvar. Verifique sua conexão.", "err");
          saveBtn.disabled=false; saveBtn.innerHTML = icon('check')+' Salvar auditoria';
        }
      });
    }
  }
}

function mostrarSucesso(pct){
  STATE.wizard=null;
  const el=document.getElementById("view");
  el.innerHTML = `
    <div class="view-fade" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; padding:0 20px">
      <svg class="success-tick" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23"/><path d="M15 27l7 7 15-15"/></svg>
      <h2 style="font-size:20px; margin-bottom:6px">Auditoria salva!</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin:0 0 22px">Conformidade registrada: <strong class="num">${pct}%</strong></p>
      <button class="btn btn-block" id="ok-voltar" style="max-width:260px">Voltar ao início</button>
    </div>`;
  document.getElementById("ok-voltar").addEventListener("click", ()=> goTab("inicio"));
  toast("Auditoria registrada com sucesso.");
}

/* ---------- HISTÓRICO ---------- */
function renderHistorico(el){
  const responsaveis = [...new Set(STATE.auditorias.map(a=>a.responsavel).filter(Boolean))].sort();
  if(STATE.hist.resp!=="todos" && !responsaveis.includes(STATE.hist.resp)) STATE.hist.resp="todos";
  let lista = [...STATE.auditorias];
  if(STATE.hist.turno!=="todos") lista = lista.filter(a=>a.turno===STATE.hist.turno);
  if(STATE.hist.resp!=="todos") lista = lista.filter(a=>a.responsavel===STATE.hist.resp);
  if(STATE.hist.soCriticos) lista = lista.filter(a=>(a.criticosNao||0)>0);
  const chave=a=>`${a.data||""}_${a.turno||""}`;
  lista.sort((a,b)=> chave(b).localeCompare(chave(a)));

  el.innerHTML = `
    <div class="filter-row">
      <button class="chip ${STATE.hist.turno==='todos'?'active':''}" data-f="turno" data-v="todos">Todos</button>
      <button class="chip ${STATE.hist.turno==='Manhã'?'active':''}" data-f="turno" data-v="Manhã">${icon('sun')} Manhã</button>
      <button class="chip ${STATE.hist.turno==='Tarde'?'active':''}" data-f="turno" data-v="Tarde">${icon('moon')} Tarde</button>
      <button class="chip ${STATE.hist.soCriticos?'active':''}" id="chip-crit">${icon('alert')} Críticos</button>
      <div class="chip">
        <select id="sel-resp">
          <option value="todos">Todos responsáveis</option>
          ${responsaveis.map(r=>`<option value="${esc(r)}" ${STATE.hist.resp===r?'selected':''}>${esc(r)}</option>`).join("")}
        </select>
      </div>
    </div>
    ${lista.length? lista.map(a=>{
      const st=statusFromPct(a.pct);
      const dt=fmtDataCurta(a.data);
      return `
      <div class="hist-card" data-id="${esc(a.id)}">
        <div class="hc-date"><div class="d">${dt.d}</div><div class="m">${dt.m}</div></div>
        <div class="hc-mid">
          <div class="turno-tag">${icon(a.turno==='Manhã'?'sun':'moon')} ${esc(a.turno)}</div>
          <div class="resp">${esc(a.responsavel||'-')}</div>
        </div>
        <div class="badge ${st.cls}">${Number(a.pct)||0}%</div>
      </div>`;
    }).join("") : `
    <div class="card empty-state">
      ${icon('inbox')}
      <div class="t">Nada por aqui</div>
      <div class="s">Nenhuma auditoria encontrada com esses filtros.</div>
    </div>`}
  `;

  el.querySelectorAll(".chip[data-f]").forEach(c=>{
    c.addEventListener("click", ()=>{ STATE.hist.turno=c.dataset.v; renderView(); });
  });
  const critChip=document.getElementById("chip-crit");
  if(critChip) critChip.addEventListener("click", ()=>{ STATE.hist.soCriticos=!STATE.hist.soCriticos; renderView(); });
  const selResp=document.getElementById("sel-resp");
  if(selResp) selResp.addEventListener("change", e=>{ STATE.hist.resp=e.target.value; renderView(); });

  el.querySelectorAll(".hist-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      const au = STATE.auditorias.find(a=>a.id===card.dataset.id);
      if(au) abrirDetalhe(au);
    });
  });
}

/* ---------- SHEET DE DETALHE ---------- */
function abrirDetalhe(au){
  STATE.auditoriaAberta = au;
  const itens = itensDoTurno(au.turno);
  const cats = categoriasComItens(itens);
  const st = statusFromPct(au.pct);

  const catsHtml = cats.map(cat=>{
    const catItens = itens.filter(i=>i.cat===cat);
    const rows = catItens.map(it=>{
      const val=(au.respostas||{})[it.id];
      const fail = it.tipo!=="texto" && it.crit && val && !CONFORMES.has(val);
      return `<div class="detail-item ${fail?'crit-fail':''}">
        <div class="di-label">${it.label}${fail? ' '+icon('alert'):''}</div>
        <div class="di-val">${esc(val || '-')}</div>
      </div>`;
    }).join("");
    const ob=((au.obsEtapas||{})[cat]||"").trim();
    const fts=(Array.isArray(au.fotos)?au.fotos:[]).filter(f=>f&&f.cat===cat&&typeof f.src==="string"&&f.src.startsWith("data:image/"));
    const extra=(ob? `<div class="detail-obs">${esc(ob)}</div>`:"") +
      (fts.length? `<div class="foto-row">${fts.map(f=>`<div class="foto-th"><img src="${f.src}" data-open alt="Foto"></div>`).join("")}</div>`:"");
    return `<div class="detail-cat"><h4>${cat}</h4>${rows}${extra}</div>`;
  }).join("");
  const hi=fmtHora(au.horaInicio), hf=fmtHora(au.horaFim), dur=duracaoMin(au.horaInicio,au.horaFim);
  const tempoHtml = hi? `<div class="detail-time">${icon('clock')} Início ${hi}${hf? ` · Fim ${hf}`:""}${dur!==null? ` · ${dur} min`:""}</div>` : "";

  const sheet=document.getElementById("sheet-detail");
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sh-title">${esc(au.turno)} · ${fmtDataBR(au.data)}</div>
      <button class="icon-btn" id="sheet-close" style="background:var(--gold-soft); color:var(--brown-3)">${icon('x')}</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-kpis">
        <div class="sk"><div class="v num" style="color:${st.cls==='ok'?'var(--ok)':st.cls==='warn'?'var(--warn)':'var(--crit)'}">${Number(au.pct)||0}%</div><div class="l">Conformidade</div></div>
        <div class="sk"><div class="v num">${Number(au.criticosNao)||0}</div><div class="l">Críticos</div></div>
        <div class="sk"><div class="v" style="font-size:14px">${esc(au.responsavel||'-')}</div><div class="l">Responsável</div></div>
      </div>
      ${tempoHtml}
      ${catsHtml}
      <button class="btn btn-block" style="background:var(--crit); margin-top:6px" id="btn-excluir">${icon('trash')} Excluir esta auditoria</button>
    </div>
  `;
  document.getElementById("sheet-backdrop").classList.add("open");
  requestAnimationFrame(()=> sheet.classList.add("open"));

  sheet.querySelectorAll("img[data-open]").forEach(im=> im.addEventListener("click", ()=> abrirFoto(im.src)));
  document.getElementById("sheet-close").addEventListener("click", fecharDetalhe);
  document.getElementById("sheet-backdrop").onclick = fecharDetalhe;
  document.getElementById("btn-excluir").addEventListener("click", async ()=>{
    const ok = await confirmDialog("Excluir auditoria?", "Essa ação não pode ser desfeita.", "Excluir");
    if(!ok) return;
    try{
      await excluirAuditoriaFirestore(au.id);
      toast("Auditoria excluída.");
      fecharDetalhe();
    }catch(err){
      console.error(err);
      toast("Erro ao excluir.", "err");
    }
  });
}
function fecharDetalhe(){
  document.getElementById("sheet-detail").classList.remove("open");
  document.getElementById("sheet-backdrop").classList.remove("open");
}

/* =========================================================
   PWA: instalar app (Chrome/Android) + dica no iPhone
   ========================================================= */
let deferredInstall=null;
const isStandalone = ()=> window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
const isIOS = ()=> /iphone|ipad|ipod/i.test(navigator.userAgent);
function installDismissed(){ try{ return localStorage.getItem("installDismissed")==="1"; }catch(e){ return false; } }
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredInstall=e;
  if(STATE.tab==="inicio" && !document.getElementById("app-root").classList.contains("hidden")) renderView();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstall=null;
  toast("App instalado! Procure o ícone na tela inicial.");
  if(STATE.tab==="inicio") renderView();
});
function installCardHtml(){
  if(isStandalone() || installDismissed()) return "";
  if(deferredInstall){
    return `<div class="install-card" id="install-card">
      <img src="auditoria-pd/icons/icon-192.png" alt="">
      <div class="ic-txt"><div class="ic-t">Instale o app no celular</div><div class="ic-s">Abre direto da tela inicial, como um aplicativo.</div></div>
      <button class="btn btn-gold" id="install-btn">Instalar</button>
      <button class="ic-close" id="install-close" aria-label="Dispensar">${ICO.x}</button>
    </div>`;
  }
  if(isIOS()){
    return `<div class="install-card" id="install-card">
      <img src="auditoria-pd/icons/icon-192.png" alt="">
      <div class="ic-txt"><div class="ic-t">Instale no iPhone</div><div class="ic-s">No Safari, toque em Compartilhar e depois em "Adicionar à Tela de Início".</div></div>
      <button class="ic-close" id="install-close" aria-label="Dispensar">${ICO.x}</button>
    </div>`;
  }
  return "";
}
function bindInstallCard(root){
  const btn=root.querySelector("#install-btn");
  if(btn) btn.addEventListener("click", async ()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall=null;
    renderView();
  });
  const close=root.querySelector("#install-close");
  if(close) close.addEventListener("click", ()=>{
    try{ localStorage.setItem("installDismissed","1"); }catch(e){}
    const card=root.querySelector("#install-card"); if(card) card.remove();
  });
}

/* =========================================================
   PWA: registra o service worker
   ========================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw-auditoria.js", {scope:"./auditoriapaodelicia.html"}).catch(err => console.error("SW falhou:", err));
  });
}
